apiVersion: apps/v1
kind: Deployment
metadata:
  name: bms-next
  namespace: stapelwerk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bms-next
  template:
    metadata:
      labels:
        app: bms-next
    spec:
      containers:
        - name: web
          image: stapelwerk-next:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: bms-next
  namespace: stapelwerk
spec:
  type: ClusterIP
  selector:
    app: bms-next
  ports:
    - name: http
      port: 3000
      targetPort: 3000