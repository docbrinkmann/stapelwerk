apiVersion: apps/v1
kind: Deployment
metadata:
  name: bms-e2e
  namespace: buildmystack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bms-e2e
  template:
    metadata:
      labels:
        app: bms-e2e
    spec:
      containers:
        - name: web
          image: nginx:1.25
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bms-e2e
  namespace: buildmystack
spec:
  type: ClusterIP
  selector:
    app: bms-e2e
  ports:
    - name: http
      port: 80
      targetPort: 80