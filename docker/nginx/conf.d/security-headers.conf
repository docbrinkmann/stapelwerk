# Security Headers Configuration for Stapelwerk
# Implements comprehensive HTTP security headers to protect against common web vulnerabilities

# Content Security Policy (CSP)
# Prevents XSS attacks by controlling which resources can be loaded
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# HTTP Strict Transport Security (HSTS)
# Forces browsers to use HTTPS for all connections
# max-age=31536000 (1 year), includeSubDomains, preload
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# X-Frame-Options
# Prevents clickjacking attacks by disallowing the site to be framed
add_header X-Frame-Options "DENY" always;

# X-Content-Type-Options
# Prevents MIME type sniffing which could lead to security vulnerabilities
add_header X-Content-Type-Options "nosniff" always;

# X-XSS-Protection
# Enables Cross-Site Scripting (XSS) filter built into most browsers
add_header X-XSS-Protection "1; mode=block" always;

# Referrer-Policy
# Controls how much referrer information is included with requests
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy (formerly Feature-Policy)
# Controls which browser features and APIs can be used
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# X-Permitted-Cross-Domain-Policies
# Restricts Adobe Flash and PDF cross-domain policies
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Cross-Origin-Embedder-Policy (COEP)
# Prevents documents from loading cross-origin resources that don't explicitly grant permission
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# Cross-Origin-Opener-Policy (COOP)
# Isolates browsing context to prevent attacks via window references
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Cross-Origin-Resource-Policy (CORP)
# Declares resource can only be loaded from same origin
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Remove Server header to hide server version information
server_tokens off;

# Cache-Control for security-sensitive resources
# Prevents caching of sensitive data
add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
