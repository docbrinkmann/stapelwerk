global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Application (Next.js) metrics
  - job_name: 'stapelwerk-app'
    scheme: http
    metrics_path: /api/metrics
    static_configs:
      - targets: ['stapelwerk-ai:8080']

  # PostgreSQL exporter (expected on :9187)
  - job_name: 'postgres-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['stapelwerk-postgres-prod:9187']

  # Redis exporter (expected on :9121)
  - job_name: 'redis-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['stapelwerk-redis-prod:9121']

  # Nginx exporter (expected on :9113)
  - job_name: 'nginx-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['stapelwerk-nginx-prod:9113']
