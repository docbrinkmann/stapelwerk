apiVersion: v1
kind: Namespace
metadata:
  name: stapelwerk
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: stapelwerk
data:
  NGINX_HOST: multi.local
---
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
  namespace: stapelwerk
type: Opaque
data:
  API_TOKEN: dG9rZW4=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: stapelwerk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secret
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - echo ok
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: stapelwerk
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: stapelwerk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: stapelwerk
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: http
      port: 6379
      targetPort: 6379
