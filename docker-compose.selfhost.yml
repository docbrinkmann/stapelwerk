# BuildMyStack — self-host compose.
#
#   1. cp .env.example .env          # then set POSTGRES_PASSWORD + NEXTAUTH_SECRET
#   2. docker compose -f docker-compose.selfhost.yml up -d --build
#   3. docker compose -f docker-compose.selfhost.yml --profile setup run --rm migrate
#   4. open http://localhost:3000 — log in with demo@buildmystack.dev / $SEED_DEMO_PASSWORD
#
# Derived from docker-compose.prod.yml, minus operator-specific machinery
# (file-mounted secrets, Sentry, CI registry variables). Until a prebuilt
# image is published, `--build` builds from this repo (BMS_IMAGE overrides).

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildmystack}
      POSTGRES_USER: ${POSTGRES_USER:-buildmystack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}
    volumes:
      # postgres:18 moved its data dir; mount the parent, not .../data
      # (a data-subpath mount + PGDATA override fails with EACCES out of the box)
      - postgres-data:/var/lib/postgresql
    networks: [bms]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildmystack} -d ${POSTGRES_DB:-buildmystack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    networks: [bms]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${BMS_IMAGE:-buildmystack}:${BMS_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle — must point at the host the BROWSER sees
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-buildmystack}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buildmystack}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required — openssl rand -base64 32}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Direct-deploy bridge: the app has no Docker socket; it delegates
      # `docker compose` to the websocket service. Same token on both sides.
      DEPLOY_BRIDGE_URL: http://websocket:3001
      DEPLOY_BRIDGE_TOKEN: ${DEPLOY_BRIDGE_TOKEN:-}
      DEPLOY_SSH_KEY_FILE: ${DEPLOY_SSH_KEY_FILE:-/deploy-keys/id_ed25519}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - deploy-keys:/deploy-keys
    networks: [bms]
    restart: unless-stopped
    healthcheck:
      # 200 = healthy, 207 = degraded-but-alive (cold-start performance sampler)
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 || r.statusCode === 207 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Realtime WebSocket server: live deploy logs + terminal. Holds the Docker
  # socket so "deploy to this server" works; remove the socket mount (and set
  # TERMINAL_EXECUTOR=echo) if you don't want direct deploys — export/handoff
  # keeps working without it.
  websocket:
    image: ${BMS_IMAGE:-buildmystack}-ws:${BMS_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    # root so the startup command can `apk add` the docker CLI (image USER is nextjs)
    user: root
    command: sh -c "apk add --no-cache docker-cli docker-cli-compose openssh-client && mkdir -p /deploy-keys && chown 1001:1001 /deploy-keys && npx tsx server/ws-server.ts"
    environment:
      NODE_ENV: production
      WS_PORT: 3001
      WS_HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-buildmystack}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buildmystack}
      DOCKER_HOST: unix:///var/run/docker.sock
      DEPLOY_BRIDGE_TOKEN: ${DEPLOY_BRIDGE_TOKEN:-}
      DEPLOY_SSH_KEY_FILE: ${DEPLOY_SSH_KEY_FILE:-/deploy-keys/id_ed25519}
      # Terminal into a stack's own bms-<stackId>-* containers, ownership-gated
      # (server/terminal-executor.ts). echo = disabled dry mode.
      TERMINAL_EXECUTOR: ${TERMINAL_EXECUTOR:-docker}
      TERMINAL_CONTAINER_PREFIX: bms-
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deploy-keys:/deploy-keys
    ports:
      - "${WS_PORT_PUBLIC:-3001}:3001"
    networks: [bms]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # One-off schema push + catalog seed:
  #   docker compose -f docker-compose.selfhost.yml --profile setup run --rm migrate
  migrate:
    profiles: ["setup"]
    image: ${BMS_IMAGE:-buildmystack}-ws:${BMS_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npx prisma db push --skip-generate && npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-buildmystack}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buildmystack}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [bms]

volumes:
  postgres-data:
  redis-data:
  deploy-keys:

networks:
  bms:
    driver: bridge
