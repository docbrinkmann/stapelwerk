# Nginx Configuration for BuildMyStack
# Location: /etc/nginx/sites-available/buildmystack

# Upstream definition for Docker container
upstream buildmystack_app {
    server ***************:3000 fail_timeout=0;
}

# HTTP Server (Redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name buildmystack.minilab.live;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name buildmystack.minilab.live;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/buildmystack.minilab.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buildmystack.minilab.live/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/buildmystack.minilab.live/chain.pem;

    # SSL Configuration (Mozilla Intermediate)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL Protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/buildmystack_access.log;
    error_log /var/log/nginx/buildmystack_error.log;

    # Max body size
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Proxy Settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket Support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffering
    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;

    # Main application
    location / {
        proxy_pass http://buildmystack_app;
        
        # Health check bypass (no caching)
        if ($request_uri ~* "^/api/health") {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # Static assets (cache for 1 year)
    location ~* ^/_next/static/ {
        proxy_pass http://buildmystack_app;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images (cache for 30 days)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        proxy_pass http://buildmystack_app;
        expires 30d;
        add_header Cache-Control "public";
    }

    # API routes (no caching)
    location /api/ {
        proxy_pass http://buildmystack_app;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # WebSocket endpoint (if specific path needed)
    location /socket.io/ {
        proxy_pass http://buildmystack_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://buildmystack_app;
        access_log off;
        add_header Cache-Control "no-store";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
