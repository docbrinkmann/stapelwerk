# OWASP ZAP Baseline Scan Configuration
# This configuration is used with zap-baseline.py for quick CI/CD security checks
#
# Usage:
#   docker run -t owasp/zap2docker-stable zap-baseline.py \
#     -t http://host.docker.internal:3000 \
#     -c zap-baseline.conf \
#     -r zap-baseline-report.html

# Ignore specific warnings that are acceptable for this application
# Format: WARN-ID: URL_PATTERN (URL_PATTERN is optional)

# Ignore missing security headers on Next.js static assets
10021	WARN	(X-Content-Type-Options Header Missing - Next.js assets)
	http://host.docker.internal:3000/_next/.*

# Ignore CSP warnings on Next.js static assets
10038	WARN	(CSP Header Not Set - Next.js assets)
	http://host.docker.internal:3000/_next/.*

# Ignore timestamp disclosure in Next.js build IDs (expected behavior)
10096	INFO	(Timestamp Disclosure - Next.js build)
	http://host.docker.internal:3000/_next/.*

# Ignore hash disclosure in Next.js asset hashes (expected behavior)
10097	INFO	(Hash Disclosure - Next.js assets)
	http://host.docker.internal:3000/_next/.*

# Allow Base64 in data URIs for images
10094	INFO	(Base64 Disclosure - data URIs)
	http://host.docker.internal:3000/.*

# Allow external font loading from Google Fonts
10017	INFO	(Cross-Domain JavaScript Source - Google Fonts)
	https://fonts.googleapis.com/.*
	https://fonts.gstatic.com/.*

# Allow external scripts from Google Analytics (if using)
10017	INFO	(Cross-Domain JavaScript Source - Google Analytics)
	https://www.googletagmanager.com/.*
	https://www.google-analytics.com/.*

# Development mode - allow WebSocket connections
10040	WARN	(Secure Pages Include Mixed Content - Development WebSockets)
	http://host.docker.internal:3000/.*
	ws://.*

# Ignore SRI for development (should be enabled in production)
90003	INFO	(Sub Resource Integrity Attribute Missing - Development)
	http://host.docker.internal:3000/.*

# Alert thresholds (PASS, WARN, FAIL)
# PASS: Scan passes if only these severity levels are found
# WARN: Scan warns but continues if these severity levels are found
# FAIL: Scan fails if these severity levels are found

# Configuration for CI/CD pipelines
# Strict mode: Fail on HIGH risks, warn on MEDIUM
FAIL-NEW: 3  # High severity
FAIL-NEW: 2  # Medium severity
WARN-NEW: 1  # Low severity
IGNORE: 0    # Info severity

# Maximum alert counts before failure
# Set to 0 to fail on any alert of that severity
MAX_HIGH: 0
MAX_MEDIUM: 5
MAX_LOW: 20
MAX_INFO: 100

# Scan duration limits
SPIDER_DURATION: 1     # 1 minute spider (baseline is fast)
AJAX_SPIDER: false     # Disable AJAX spider for speed
PASSIVE_SCAN: true     # Always run passive scan

# Authentication (if needed)
# AUTH_USERNAME: ""
# AUTH_PASSWORD: ""
# AUTH_URL: "http://host.docker.internal:3000/api/auth/signin"
# AUTH_METHOD: "form"

# Context exclusions (paths to skip)
EXCLUDE: /_next/static/.*
EXCLUDE: /_next/image/.*
EXCLUDE: /favicon.ico
EXCLUDE: .*\\.map$
EXCLUDE: .*\\.woff2$
EXCLUDE: .*\\.woff$
EXCLUDE: .*\\.ttf$
EXCLUDE: .*\\.eot$
EXCLUDE: .*\\.svg$
EXCLUDE: .*\\.png$
EXCLUDE: .*\\.jpg$
EXCLUDE: .*\\.jpeg$
EXCLUDE: .*\\.gif$
EXCLUDE: .*\\.webp$

# Technology detection
TECH_DETECTION: true

# Progress and logging
PROGRESS: true
VERBOSE: false
