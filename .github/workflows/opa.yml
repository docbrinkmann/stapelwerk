name: OPA Policy Engine

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  opa-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install OPA CLI
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Compile Rego to WASM
        run: npm run build:opa:wasm

      - name: Run OPA-related tests
        run: npm run test:security:opa
