name: E2E Manual Verification Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: e2e-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-verification-tests:
    name: Manual Verification E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buildmystack_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buildmystack_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Deploy database schema
        run: npm run db:deploy

      - name: Seed database with test data
        run: npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start application server
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          PORT: 3000

      - name: Run manual verification tests
        run: npx playwright test e2e-tests/manual-verification.spec.ts --project=chromium --reporter=html,json,github
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-manual

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-manual-verification
          path: playwright-report-manual/
          retention-days: 7

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-screenshots
          path: agent-os/specs/2025-10-26-production-readiness-fixes/verification/screenshots/
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-manual
          path: test-results/
          retention-days: 7

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## 🧪 Manual Verification Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suites:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Task 2.2: ServicePreviewModal Complete Information Display" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Task 4.3: Infinite Scroll with Seeded Data" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Modal Loading State Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Modal Error State Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Modal Accessibility Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Modal Edge Cases and Stress Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Infinite Scroll Edge Cases" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 HTML Report: [Download playwright-report-manual-verification]" >> $GITHUB_STEP_SUMMARY
          echo "- 📸 Screenshots: [Download verification-screenshots]" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 Test Results: [Download test-results-manual]" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage:" >> $GITHUB_STEP_SUMMARY
          echo "- Modal functionality: Open/Close, Data Display, Keyboard Navigation" >> $GITHUB_STEP_SUMMARY
          echo "- Infinite scroll: Initial load, Scroll triggering, Data integrity" >> $GITHUB_STEP_SUMMARY
          echo "- Error handling: Network failures, Empty states, Retry functionality" >> $GITHUB_STEP_SUMMARY
          echo "- Accessibility: Focus trap, ARIA attributes, Screen readers" >> $GITHUB_STEP_SUMMARY
          echo "- Edge cases: Rapid interactions, Multiple services, Responsive design" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = `
            ## 🎭 Playwright Manual Verification Test Results
            
            **Status:** ${{ job.status }}
            
            ### Test Suites Executed:
            - ✅ ServicePreviewModal Information Display (Task 2.2)
            - ✅ Infinite Scroll with Seeded Data (Task 4.3)
            - ✅ Modal Loading/Error States
            - ✅ Accessibility Compliance
            - ✅ Edge Cases & Stress Tests
            
            ### Artifacts:
            - [📊 Playwright HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [📸 Verification Screenshots](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            **Full details:** Check the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
