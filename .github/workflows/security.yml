name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level moderate --production
        continue-on-error: true

      - name: Generate security report
        run: |
          echo "## Security Audit Report" > security-report.md
          echo "Generated on: $(date)" >> security-report.md
          echo "" >> security-report.md
          echo "### NPM Audit Results" >> security-report.md
          npm audit --audit-level moderate --production >> security-report.md 2>&1 || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-report.md
          retention-days: 7

  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "detect --no-banner --source . --verbose --redact"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build for analysis
        run: npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  security-tests:
    name: Security Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buildmystack_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buildmystack_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Deploy database schema
        run: npm run db:deploy

      - name: Run security tests
        run: npm run test:security

      - name: Upload security test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  trivy-scan:
    name: Trivy Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile.dev -t build-my-stack:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'build-my-stack:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate Trivy report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'build-my-stack:latest'
          format: 'table'
          output: 'trivy-report.txt'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-report
          path: trivy-report.txt
          retention-days: 7

  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule' # Skip on scheduled runs unless Snyk token is available

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium --file=package.json

      - name: Upload Snyk report
        uses: github/codeql-action/upload-sarif@v3
        if: always() && env.SNYK_TOKEN
        with:
          sarif_file: snyk.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  security-headers-check:
    name: Security Headers Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate security headers configuration
        run: |
          echo "Checking Next.js security configuration..."
          
          # Check if security headers are configured
          if [ -f "next.config.js" ]; then
            echo "✅ next.config.js found"
            if grep -q "X-Frame-Options\|Content-Security-Policy\|X-Content-Type-Options" next.config.js; then
              echo "✅ Security headers configured in Next.js"
            else
              echo "⚠️ Security headers not found in next.config.js"
            fi
          fi
          
          # Check Vercel configuration
          if [ -f "vercel.json" ]; then
            echo "✅ vercel.json found"
            if grep -q "X-Frame-Options\|Content-Security-Policy\|X-Content-Type-Options" vercel.json; then
              echo "✅ Security headers configured in Vercel"
            else
              echo "⚠️ Security headers not found in vercel.json"
            fi
          fi

  security-status:
    name: Security Status Check
    runs-on: ubuntu-latest
    needs: [dependency-audit, codeql, security-tests, trivy-scan, gitleaks]
    if: always()

    steps:
      - name: Check Security Status
        run: |
          echo "=== Security Scan Summary ==="
          echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "CodeQL Analysis: ${{ needs.codeql.result }}"
          echo "Security Tests: ${{ needs.security-tests.result }}"
          echo "Container Scan: ${{ needs.trivy-scan.result }}"
          echo "Secret Scan (Gitleaks): ${{ needs.gitleaks.result }}"
          
          # Don't fail the overall check if only optional scans fail
          if [[ "${{ needs.dependency-audit.result }}" == "success" && 
                "${{ needs.security-tests.result }}" == "success" ]]; then
            echo "✅ Core security checks passed!"
            exit 0
          else
            echo "❌ Core security checks failed!"
            exit 1
          fi
