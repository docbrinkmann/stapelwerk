name: Policy Check

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - name: Run Policy Check (sample)
        run: |
          echo '{"organizationId":"org-ci","security_score":90,"enabled_frameworks":["soc2"],"findings":[]}' > policy-input.json
          node --loader tsx scripts/policy-check.ts policy-input.json