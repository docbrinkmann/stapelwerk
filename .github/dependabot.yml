version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    assignees:
      - "docbrinkmann"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    # Group related updates
    groups:
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
      next-ecosystem:
        patterns:
          - "next*"
          - "@next/*"
      testing-framework:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "playwright*"
          - "@playwright/*"
          - "@testing-library/*"
      build-tools:
        patterns:
          - "typescript"
          - "eslint*"
          - "prettier*"
          - "vite*"
          - "@vitejs/*"
      database:
        patterns:
          - "prisma*"
          - "@prisma/*"
      trpc:
        patterns:
          - "@trpc/*"
      security:
        patterns:
          - "*security*"
          - "*audit*"
    # Ignore specific dependencies that need manual updates
    ignore:
      - dependency-name: "node"
        # Ignore major version updates for Node.js in production
        update-types: ["version-update:semver-major"]
      # Majors that need a dedicated migration rather than a bot bump (reviewed 2026-10):
      # TS 7 (native compiler) — typescript-eslint supports TypeScript <6.1 only.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 — eslint-config-next's bundled react/jsx-a11y/import plugins cap at ESLint 9.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Prisma 7 — driver adapters + prisma.config.ts; migrate deliberately, not via Dependabot.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    assignees:
      - "docbrinkmann"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "ci/cd"
      - "automated"

  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    assignees:
      - "docbrinkmann"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "docker"
      - "infrastructure"
      - "automated"