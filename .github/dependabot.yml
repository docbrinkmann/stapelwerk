version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "@sebastianlopezlopez"
    assignees:
      - "@sebastianlopezlopez"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    # Group related updates
    groups:
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
      next-ecosystem:
        patterns:
          - "next*"
          - "@next/*"
      testing-framework:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "playwright*"
          - "@playwright/*"
          - "@testing-library/*"
      build-tools:
        patterns:
          - "typescript"
          - "eslint*"
          - "prettier*"
          - "vite*"
          - "@vitejs/*"
      database:
        patterns:
          - "prisma*"
          - "@prisma/*"
      trpc:
        patterns:
          - "@trpc/*"
      security:
        patterns:
          - "*security*"
          - "*audit*"
    # Ignore specific dependencies that need manual updates
    ignore:
      - dependency-name: "node"
        # Ignore major version updates for Node.js in production
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "@sebastianlopezlopez"
    assignees:
      - "@sebastianlopezlopez"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "ci/cd"
      - "automated"

  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "@sebastianlopezlopez"
    assignees:
      - "@sebastianlopezlopez"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "docker"
      - "infrastructure"
      - "automated"