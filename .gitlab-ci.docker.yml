# GitLab CI/CD Pipeline for Stapelwerk - Docker Deployment
# This pipeline deploys to Docker containers on gitlab.minilab.live + GitLab Pages

image: node:22-alpine

stages:
  - install
  - test
  - build-docker
  - build-static
  - deploy-docker
  - deploy-pages

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHA
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/
    - node_modules/
    - .next/cache/

# Install dependencies
install:
  stage: install
  script:
    - corepack enable pnpm
    - pnpm install --frozen-lockfile
    - pnpm prisma generate
  artifacts:
    paths:
      - node_modules/
      - .pnpm-store/
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests

# Run tests with 95%+ coverage
test:
  stage: test
  dependencies:
    - install
  services:
    - postgres:18-alpine
  variables:
    POSTGRES_DB: stapelwerk_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/stapelwerk_test"
  script:
    - corepack enable pnpm
    - pnpm prisma generate
    - pnpm prisma migrate deploy
    - pnpm run test:ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  only:
    - main
    - develop

# Build Docker image
build:docker:
  stage: build-docker
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
    - echo $CI_COMMIT_SHA > image_tag.txt
  artifacts:
    paths:
      - image_tag.txt
    expire_in: 1 day
  only:
    - main

# Build static documentation
build:static:
  stage: build-static
  dependencies:
    - install
  script:
    - corepack enable pnpm
    - mkdir -p public/docs
    - echo "<!DOCTYPE html><html><head><title>Stapelwerk Docs</title></head><body><h1>Stapelwerk Documentation</h1><p>Coming soon...</p></body></html>" > public/docs/index.html
  artifacts:
    paths:
      - public/
    expire_in: 1 hour
  only:
    - main

# Deploy to Docker server
deploy:docker:
  stage: deploy-docker
  image: alpine:latest
  dependencies:
    - build:docker
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - export IMAGE_TAG=$(cat image_tag.txt)
    - |
      ssh $SERVER_USER@$SERVER_HOST << 'EOF'
        cd /opt/stapelwerk
        export DOCKER_IMAGE_TAG='$IMAGE_TAG'
        docker pull $CI_REGISTRY_IMAGE:$IMAGE_TAG
        docker compose up -d --no-deps app
        sleep 15
        docker compose ps
      EOF
  environment:
    name: production
    url: https://app.stapelwerk.dev
  only:
    - main
  when: manual

# Deploy to GitLab Pages
pages:
  stage: deploy-pages
  dependencies:
    - build:static
  script:
    - ls -la public/
  artifacts:
    paths:
      - public
  only:
    - main
