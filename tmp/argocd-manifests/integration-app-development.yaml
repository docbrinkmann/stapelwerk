apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: integration-app-development
spec:
  project: default
  source:
    repoURL: https://github.com/org/repo
    path: manifests
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true